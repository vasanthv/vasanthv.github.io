---
layout: default
---
<article class="prose">
  <p class="archive-kicker">Tagged</p>
  <h1 class="page-title">#{{ page.title }}</h1>

  <p class="page-lede">
    {{ page.posts | size }} post{% if page.posts.size != 1 %}s{% endif %} ·
    <a href="{{ '/' | relative_url }}">All posts</a>
  </p>

  <ul class="post-list">
    {% for post in page.posts %}
      <li class="post-list__item">
        <a class="post-list__link" href="{{ post.url | relative_url }}">
          <span class="post-list__title">{{ post.title }}</span><time class="post-list__date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
        </a>
      </li>
    {% endfor %}
  </ul>
</article>
